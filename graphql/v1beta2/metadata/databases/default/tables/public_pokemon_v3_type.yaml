        table:
          name: pokemon_v3_typeefficacypast
          schema: public
  - name: typegameindices
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_typegameindex
          schema: public
  - name: typenames
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_typename
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
      query_root_fields:
        - select
        - select_aggregate
      subscription_root_fields: []
