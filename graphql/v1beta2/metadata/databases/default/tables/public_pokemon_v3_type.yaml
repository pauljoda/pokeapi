table:
  name: pokemon_v3_type
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: type
  custom_root_fields: {}
object_relationships:
  - name: generation
    using:
      foreign_key_constraint_on: generation_id
  - name: movedamageclass
    using:
      foreign_key_constraint_on: move_damage_class_id
array_relationships:
  - name: PokemonevolutionsByPartyTypeId
    using:
      foreign_key_constraint_on:
        column: party_type_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: TypeefficaciesByTargetTypeId
    using:
      foreign_key_constraint_on:
        column: target_type_id
        table:
          name: pokemon_v3_typeefficacy
          schema: public
  - name: TypeefficacypastsByTargetTypeId
    using:
      foreign_key_constraint_on:
        column: target_type_id
        table:
          name: pokemon_v3_typeefficacypast
          schema: public
  - name: berries
    using:
      foreign_key_constraint_on:
        column: natural_gift_type_id
        table:
          name: pokemon_v3_berry
          schema: public
  - name: movechanges
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_movechange
          schema: public
  - name: moves
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_move
          schema: public
  - name: pokemon_v3_typesprites
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_typesprites
          schema: public
  - name: pokemonevolutions
    using:
      foreign_key_constraint_on:
        column: known_move_type_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: pokemonformtypes
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_pokemonformtype
          schema: public
  - name: pokemontypepasts
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_pokemontypepast
          schema: public
  - name: pokemontypes
    using:
      foreign_key_constraint_on:
        column: type_id
        table:
          name: pokemon_v3_pokemontype
          schema: public
  - name: typeefficacies
    using:
      foreign_key_constraint_on:
        column: damage_type_id
        table:
          name: pokemon_v3_typeefficacy
          schema: public
  - name: typeefficacypasts
    using:
      foreign_key_constraint_on:
