    using:
      foreign_key_constraint_on:
        column: known_move_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: pokemonmoves
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_pokemonmove
          schema: public
  - name: supercontestcombos
    using:
      foreign_key_constraint_on:
        column: first_move_id
        table:
          name: pokemon_v3_supercontestcombo
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
      query_root_fields:
        - select
        - select_aggregate
      subscription_root_fields: []
