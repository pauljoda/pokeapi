        table:
          name: pokemon_v3_supercontestcombo
          schema: public
  - name: contestcombos
    using:
      foreign_key_constraint_on:
        column: first_move_id
        table:
          name: pokemon_v3_contestcombo
          schema: public
  - name: machines
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_machine
          schema: public
  - name: moveattributemaps
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_moveattributemap
          schema: public
  - name: movechanges
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_movechange
          schema: public
  - name: moveflavortexts
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_moveflavortext
          schema: public
  - name: movemeta
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_movemeta
          schema: public
  - name: movemetastatchanges
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_movemetastatchange
          schema: public
  - name: movenames
    using:
      foreign_key_constraint_on:
        column: move_id
        table:
          name: pokemon_v3_movename
          schema: public
