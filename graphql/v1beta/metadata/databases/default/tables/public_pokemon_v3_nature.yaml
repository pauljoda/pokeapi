table:
  name: pokemon_v3_nature
  schema: public
object_relationships:
  - name: pokemonV2BerryflavorByLikesFlavorId
    using:
      foreign_key_constraint_on: likes_flavor_id
  - name: pokemonV2StatByIncreasedStatId
    using:
      foreign_key_constraint_on: increased_stat_id
  - name: pokemon_v3_berryflavor
    using:
      foreign_key_constraint_on: hates_flavor_id
  - name: pokemon_v3_stat
    using:
      foreign_key_constraint_on: decreased_stat_id
array_relationships:
  - name: pokemon_v3_naturebattlestylepreferences
    using:
      foreign_key_constraint_on:
        column: nature_id
        table:
          name: pokemon_v3_naturebattlestylepreference
          schema: public
  - name: pokemon_v3_naturenames
    using:
      foreign_key_constraint_on:
        column: nature_id
        table:
          name: pokemon_v3_naturename
          schema: public
  - name: pokemon_v3_naturepokeathlonstats
    using:
      foreign_key_constraint_on:
        column: nature_id
        table:
          name: pokemon_v3_naturepokeathlonstat
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
