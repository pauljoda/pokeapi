table:
  name: pokemon_v3_location
  schema: public
object_relationships:
  - name: pokemon_v3_region
    using:
      foreign_key_constraint_on: region_id
array_relationships:
  - name: pokemon_v3_locationareas
    using:
      foreign_key_constraint_on:
        column: location_id
        table:
          name: pokemon_v3_locationarea
          schema: public
  - name: pokemon_v3_locationgameindices
    using:
      foreign_key_constraint_on:
        column: location_id
        table:
          name: pokemon_v3_locationgameindex
          schema: public
  - name: pokemon_v3_locationnames
    using:
      foreign_key_constraint_on:
        column: location_id
        table:
          name: pokemon_v3_locationname
          schema: public
  - name: pokemon_v3_pokemonevolutions
    using:
      foreign_key_constraint_on:
        column: location_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
