table:
  name: pokemon_v3_berryflavor
  schema: public
object_relationships:
  - name: pokemon_v3_contesttype
    using:
      foreign_key_constraint_on: contest_type_id
array_relationships:
  - name: pokemonV2NaturesByLikesFlavorId
    using:
      foreign_key_constraint_on:
        column: likes_flavor_id
        table:
          name: pokemon_v3_nature
          schema: public
  - name: pokemon_v3_berryflavormaps
    using:
      foreign_key_constraint_on:
        column: berry_flavor_id
        table:
          name: pokemon_v3_berryflavormap
          schema: public
  - name: pokemon_v3_berryflavornames
    using:
      foreign_key_constraint_on:
        column: berry_flavor_id
        table:
          name: pokemon_v3_berryflavorname
          schema: public
  - name: pokemon_v3_natures
    using:
      foreign_key_constraint_on:
        column: hates_flavor_id
        table:
          name: pokemon_v3_nature
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
