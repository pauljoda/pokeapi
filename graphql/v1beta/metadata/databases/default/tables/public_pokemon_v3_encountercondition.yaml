table:
  name: pokemon_v3_encountercondition
  schema: public
array_relationships:
  - name: pokemon_v3_encounterconditionnames
    using:
      foreign_key_constraint_on:
        column: encounter_condition_id
        table:
          name: pokemon_v3_encounterconditionname
          schema: public
  - name: pokemon_v3_encounterconditionvalues
    using:
      foreign_key_constraint_on:
        column: encounter_condition_id
        table:
          name: pokemon_v3_encounterconditionvalue
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
