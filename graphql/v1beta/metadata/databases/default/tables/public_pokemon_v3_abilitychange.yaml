table:
  name: pokemon_v3_abilitychange
  schema: public
object_relationships:
  - name: pokemon_v3_ability
    using:
      foreign_key_constraint_on: ability_id
  - name: pokemon_v3_versiongroup
    using:
      foreign_key_constraint_on: version_group_id
array_relationships:
  - name: pokemon_v3_abilitychangeeffecttexts
    using:
      foreign_key_constraint_on:
        column: ability_change_id
        table:
          name: pokemon_v3_abilitychangeeffecttext
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
