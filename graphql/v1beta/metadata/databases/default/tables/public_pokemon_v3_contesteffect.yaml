table:
  name: pokemon_v3_contesteffect
  schema: public
array_relationships:
  - name: pokemon_v3_contesteffecteffecttexts
    using:
      foreign_key_constraint_on:
        column: contest_effect_id
        table:
          name: pokemon_v3_contesteffecteffecttext
          schema: public
  - name: pokemon_v3_contesteffectflavortexts
    using:
      foreign_key_constraint_on:
        column: contest_effect_id
        table:
          name: pokemon_v3_contesteffectflavortext
          schema: public
  - name: pokemon_v3_moves
    using:
      foreign_key_constraint_on:
        column: contest_effect_id
        table:
          name: pokemon_v3_move
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
