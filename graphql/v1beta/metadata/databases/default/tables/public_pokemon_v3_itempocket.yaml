      foreign_key_constraint_on:
        column: item_pocket_id
        table:
          name: pokemon_v3_itemcategory
          schema: public
  - name: pokemon_v3_itempocketnames
    using:
      foreign_key_constraint_on:
        column: item_pocket_id
        table:
          name: pokemon_v3_itempocketname
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
