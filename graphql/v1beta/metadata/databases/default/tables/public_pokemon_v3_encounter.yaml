table:
  name: pokemon_v3_encounter
  schema: public
object_relationships:
  - name: pokemon_v3_encounterslot
    using:
      foreign_key_constraint_on: encounter_slot_id
  - name: pokemon_v3_locationarea
    using:
      foreign_key_constraint_on: location_area_id
  - name: pokemon_v3_pokemon
    using:
      foreign_key_constraint_on: pokemon_id
  - name: pokemon_v3_version
    using:
      foreign_key_constraint_on: version_id
array_relationships:
  - name: pokemon_v3_encounterconditionvaluemaps
    using:
      foreign_key_constraint_on:
        column: encounter_id
        table:
          name: pokemon_v3_encounterconditionvaluemap
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
