table:
  name: pokemon_v3_itemcategory
  schema: public
object_relationships:
  - name: pokemon_v3_itempocket
    using:
      foreign_key_constraint_on: item_pocket_id
array_relationships:
  - name: pokemon_v3_itemcategorynames
    using:
      foreign_key_constraint_on:
        column: item_category_id
        table:
          name: pokemon_v3_itemcategoryname
          schema: public
  - name: pokemon_v3_items
    using:
      foreign_key_constraint_on:
        column: item_category_id
        table:
          name: pokemon_v3_item
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
