table:
  name: pokemon_v3_pokemonform
  schema: public
object_relationships:
  - name: pokemon_v3_pokemon
    using:
      foreign_key_constraint_on: pokemon_id
  - name: pokemon_v3_versiongroup
    using:
      foreign_key_constraint_on: version_group_id
array_relationships:
  - name: pokemon_v3_pokemonformgenerations
    using:
      foreign_key_constraint_on:
        column: pokemon_form_id
        table:
          name: pokemon_v3_pokemonformgeneration
          schema: public
  - name: pokemon_v3_pokemonformnames
    using:
      foreign_key_constraint_on:
        column: pokemon_form_id
        table:
          name: pokemon_v3_pokemonformname
          schema: public
  - name: pokemon_v3_pokemonformsprites
    using:
      foreign_key_constraint_on:
        column: pokemon_form_id
        table:
          name: pokemon_v3_pokemonformsprites
          schema: public
  - name: pokemon_v3_pokemonformtypes
    using:
      foreign_key_constraint_on:
        column: pokemon_form_id
        table:
          name: pokemon_v3_pokemonformtype
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
