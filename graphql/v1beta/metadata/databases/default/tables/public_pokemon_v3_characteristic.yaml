table:
  name: pokemon_v3_characteristic
  schema: public
object_relationships:
  - name: pokemon_v3_stat
    using:
      foreign_key_constraint_on: stat_id
array_relationships:
  - name: pokemon_v3_characteristicdescriptions
    using:
      foreign_key_constraint_on:
        column: characteristic_id
        table:
          name: pokemon_v3_characteristicdescription
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
