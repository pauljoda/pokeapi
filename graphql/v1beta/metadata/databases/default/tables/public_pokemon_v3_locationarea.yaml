table:
  name: pokemon_v3_locationarea
  schema: public
object_relationships:
  - name: pokemon_v3_location
    using:
      foreign_key_constraint_on: location_id
array_relationships:
  - name: pokemon_v3_encounters
    using:
      foreign_key_constraint_on:
        column: location_area_id
        table:
          name: pokemon_v3_encounter
          schema: public
  - name: pokemon_v3_locationareaencounterrates
    using:
      foreign_key_constraint_on:
        column: location_area_id
        table:
          name: pokemon_v3_locationareaencounterrate
          schema: public
  - name: pokemon_v3_locationareanames
    using:
      foreign_key_constraint_on:
        column: location_area_id
        table:
          name: pokemon_v3_locationareaname
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
