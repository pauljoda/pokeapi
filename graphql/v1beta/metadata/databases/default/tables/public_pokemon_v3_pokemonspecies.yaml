table:
  name: pokemon_v3_pokemonspecies
  schema: public
object_relationships:
  - name: pokemon_v3_evolutionchain
    using:
      foreign_key_constraint_on: evolution_chain_id
  - name: pokemon_v3_generation
    using:
      foreign_key_constraint_on: generation_id
  - name: pokemon_v3_growthrate
    using:
      foreign_key_constraint_on: growth_rate_id
  - name: pokemon_v3_pokemoncolor
    using:
      foreign_key_constraint_on: pokemon_color_id
  - name: pokemon_v3_pokemonhabitat
    using:
      foreign_key_constraint_on: pokemon_habitat_id
  - name: pokemon_v3_pokemonshape
    using:
      foreign_key_constraint_on: pokemon_shape_id
  - name: pokemon_v3_pokemonspecy
    using:
      foreign_key_constraint_on: evolves_from_species_id
array_relationships:
  - name: pokemonV2PokemonevolutionsByPartySpeciesId
    using:
      foreign_key_constraint_on:
        column: party_species_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: pokemonV2PokemonevolutionsByTradeSpeciesId
    using:
      foreign_key_constraint_on:
        column: trade_species_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: pokemon_v3_palparks
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_palpark
          schema: public
  - name: pokemon_v3_pokemondexnumbers
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemondexnumber
          schema: public
  - name: pokemon_v3_pokemonegggroups
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemonegggroup
          schema: public
  - name: pokemon_v3_pokemonevolutions
    using:
      foreign_key_constraint_on:
        column: evolved_species_id
        table:
          name: pokemon_v3_pokemonevolution
          schema: public
  - name: pokemon_v3_pokemons
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemon
          schema: public
  - name: pokemon_v3_pokemonspecies
    using:
      foreign_key_constraint_on:
        column: evolves_from_species_id
        table:
          name: pokemon_v3_pokemonspecies
          schema: public
  - name: pokemon_v3_pokemonspeciesdescriptions
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemonspeciesdescription
          schema: public
  - name: pokemon_v3_pokemonspeciesflavortexts
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemonspeciesflavortext
          schema: public
  - name: pokemon_v3_pokemonspeciesnames
    using:
      foreign_key_constraint_on:
        column: pokemon_species_id
        table:
          name: pokemon_v3_pokemonspeciesname
          schema: public
select_permissions:
  - role: anon
    permission:
      columns: '*'
      filter: {}
      limit: 100000
      allow_aggregations: true
