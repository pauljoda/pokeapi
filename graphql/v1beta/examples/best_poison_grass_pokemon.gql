"""
Returns the strongest 3 grass and poison pokemon. It uses thier stats to compute their strenght.
"""

query best_grass_poison_pokemons {
  pokemon: pokemon_v3_pokemon(
    where: {
      _and: [
        {
          pokemon_v3_pokemontypes: {
            pokemon_v3_type: { name: { _eq: "grass" } }
          }
        }
        {
          pokemon_v3_pokemontypes: {
            pokemon_v3_type: { name: { _eq: "poison" } }
          }
        }
      ]
    }
    order_by: {
      pokemon_v3_pokemonstats_aggregate: { sum: { base_stat: desc } }
    }
    limit: 3
  ) {
    name
    stats: pokemon_v3_pokemonstats_aggregate(order_by: {}) {
      aggregate {
        sum {
          base_stat
        }
      }
    }
  }
}
